  - week: 12
    date: 2026-12-04
    module: "AI for Computing"
    title: "AI for RTL and Chip Physical Design"
    type: seminar
    exercise: "In-class critical reading: the RedWood white paper (Architect Labs 2026) audited with the evidence-centered checklist"
    papers:
      - {title: "A Graph Placement Methodology for Fast Chip Design (AlphaChip)", venue: "Nature 2021 (+2024 addendum)", url: "https://www.nature.com/articles/s41586-021-03544-w", focus: "read with Markov's 'The False Dawn' critique; co-led by a pair", companion_url: "https://arxiv.org/abs/2306.09633", co_led: true}
      - {title: "ChipNeMo: Domain-Adapted LLMs for Chip Design", venue: "NVIDIA 2024", url: "https://arxiv.org/abs/2311.00176", focus: "domain adaptation, retrieval, EDA scripts"}
      - {title: "VerilogEval: Evaluating Large Language Models for Verilog Code Generation", venue: "ICCAD 2023", url: "https://arxiv.org/abs/2309.07544", focus: "RTL benchmarks and their limitations"}
