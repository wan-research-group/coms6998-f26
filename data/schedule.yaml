# COMS 6998 AI-Native Computing - Fall 2026 - canonical structured course data.
# The public syllabus is generated from this file and build.py.
# Verify new reading links against primary sources when updating the schedule.

course:
  number: "COMS 6998"
  title: "AI-Native Computing: Hardware for AI, AI for Hardware"
  semester: "Fall 2026"
  meeting: "Fridays 10:10 AM - 12:00 PM"
  location: "MUDD Building 825"
  instructor:
    name: "Prof. Zishen Wan"
    email: "zishen.wan@columbia.edu"
    homepage: "https://zishenwan.github.io/"
    lab: "https://wan-research-group.github.io/"
    office_hours: "Wednesdays 5-6 PM, CSB 522"
    canvas: "https://courseworks2.columbia.edu/courses/sis_course_id:COMSE6998_020_2026_3"
  teaching_assistants:
    - {name: "Sergey Sokolovskiy", email: "ss7299@columbia.edu"}
    - {name: "Priyal Agarwal", email: "pa2746@columbia.edu"}
  enrollment_cap: 30

grading:
  - {component: "Paper presentation & discussion leadership", weight: 15}
  - {component: "Engagement & participation", weight: 10}
  - {component: "Project proposal", weight: 10}
  - {component: "Project check-ins P1-P5 (completion-based)", weight: 15}
  - {component: "Midterm presentation", weight: 10}
  - {component: "Final poster", weight: 10}
  - {component: "Final paper & artifact", weight: 30}

milestones:
  - date: 2026-10-05
    id: Proposal
    name: "Project proposal"
    checklist: ["State the research question, closest work, and testable hypothesis.", "Specify baselines, metrics, resource needs, and team responsibilities."]
  - date: 2026-10-19
    id: P1
    name: "Infrastructure & baselines"
    checklist: ["Share a runnable repository with setup instructions.", "Report the first baseline measurement and its configuration."]
  - date: 2026-11-02
    id: P2
    name: "Prototype & pilot results"
    checklist: ["Run a minimal end-to-end prototype.", "Include one pilot comparison figure and the main remaining risk."]
  - date: 2026-11-06
    id: Midterm
    name: "Midterm presentation (in class)"
    checklist: ["Present the question, approach, baseline, and early evidence.", "Identify the feedback needed and the next experiments."]
  - date: 2026-11-23
    id: P3
    name: "Evaluation plan & initial results"
    checklist: ["Fix the workloads, metrics, baselines, and experiment budget.", "Submit initial comparisons and the planned ablations."]
  - date: 2026-12-07
    id: P4
    name: "Main results & ablations"
    checklist: ["Submit main results, an ablation, and a failure or boundary case.", "Include repeated measurements or uncertainty where relevant."]
  - date: 2026-12-11
    id: P5
    name: "Complete draft, artifact & poster; final poster session (in class)"
    checklist: ["Submit a complete paper draft and a runnable artifact.", "Upload the poster by Dec 10 and present it in class on Dec 11."]
  - date: 2026-12-18
    id: Final
    name: "Final paper & artifact"
    checklist: ["Submit the revised paper, artifact, and figure-generation scripts.", "Include responses to feedback and individual contributions."]

registrar_dates:
  - {date: 2026-09-18, note: "Last day to add (Change of Program)"}
  - {date: 2026-10-13, note: "Drop deadline"}
  - {date: 2026-11-19, note: "Pass/fail & withdrawal deadline"}
  - {date: 2026-11-27, note: "No class - Thanksgiving"}

