    type: lecture
    slides: "assets/slides/COMS6998_F26_Week1.pdf"
    background:
      - {short_title: "A New Golden Age", title: "A New Golden Age for Computer Architecture", venue: "CACM 2019", url: "https://doi.org/10.1145/3282307"}
      - {short_title: "GenAI for Systems", title: "GenAI for Systems: Recurring Challenges and Design Principles from Software to Silicon", venue: "arXiv 2026", url: "https://arxiv.org/abs/2602.15241"}
    optional:
      - {title: "The Bitter Lesson (2019)", url: "http://www.incompleteideas.net/IncIdeas/BitterLesson.html"}
