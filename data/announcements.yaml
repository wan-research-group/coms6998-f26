# Course announcements, newest first. The build renders them in file order.
# Each entry: date (YYYY-MM-DD), text, and an optional link + link_text pair.
#
# Example:
#   - date: 2026-09-11
#     text: "Slides for Week 1 are posted."
#     link: "https://example.com/slides"
#     link_text: "slides"

announcements:
  - date: 2026-08-31
    text: "The background and project-fit form will be released Sep 8 to enrolled and waitlisted students; it closes Sep 12 at 5:00 PM."
  - date: 2026-08-30
    text: "Course website is live. Syllabus v4 is posted; readings and logistics may be refined before the semester begins."
